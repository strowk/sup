# Pin the linux-gnu images to a cross release built on an older glibc
# (Ubuntu 20.04, glibc 2.31). Newer cross defaults link against glibc 2.38/2.39,
# which is not present in the debian:12 base used to build the .deb package,
# breaking `sup --version` during Debian packaging.
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:0.2.5"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5"

[target.aarch64-apple-darwin]
image = "ghcr.io/cross-rs/aarch64-apple-darwin-cross:local"

[target.x86_64-apple-darwin]
image = "ghcr.io/cross-rs/x86_64-apple-darwin-cross:local"